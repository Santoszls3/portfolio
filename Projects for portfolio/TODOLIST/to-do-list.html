<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
<link href="js/to-do-list.js">


<style>
    body {
        background-color: #f4f5f7;
        font-family: Arial, sans-serif;
        color: #212529;
        padding-bottom: 50px;
    }

    .container {
        max-width: 1000px;
    }

    header {
        padding: 30px 0 20px;
    }

    h1 {
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -1px;
        margin-bottom: 0;
    }

    header::after {
        content: "";
        display: block;
        width: 60px;
        height: 4px;
        background-color: #212529;
        margin: 15px auto 0;
        border-radius: 10px;
    }

    main {
        background-color: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    #to-do-form {
        background-color: #f8f9fa;
        padding: 25px;
        border-radius: 12px;
    }

    #to-do-form h3 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 15px;
    }

    #to-do {
        border-radius: 8px;
        padding: 12px;
        border: 1px solid #ced4da;
    }

    #to-do:focus {
        border-color: #212529;
        box-shadow: none;
    }

    .add {
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
    }

    #to-do-list {
        border-radius: 10px;
        overflow: hidden;
    }

    #to-do-list .to-do-item {
        padding: 16px 18px;
        border-left: none;
        border-right: none;
        transition: transform 0.15s ease, background-color 0.15s ease;
    }

    #to-do-list .to-do-item:hover {
        background-color: #f8f9fa;
        transform: translateX(3px);
    }

    #to-do-list p {
        font-size: 17px;
        margin: 0;
    }

    .delete {
        border-radius: 7px;
        font-size: 13px;
        padding: 7px 14px;
        border: none;
    }
</style>



<link rel="stylesheet" href="to-do-list.css">

</head>
<body>
<div class="container">
    <header class="text-center my-4">
        <h1>To-Do List</h1>
    </header>
    <main class="row">
        <section class="border border-lg-none p-4 col-lg-4">
            <form id="to-do-form">
                <h3><label class="form-label" for="to-do">Enter to-do:</label></h3>
                <input class="form-control" type="text" name="to-do" id="to-do">
                <div class="d-grid"><button class="btn btn-secondary mt-3 add">Add To-Do</button></div>
            </form>
        </section>

<!--         ****** todo list ******-->
        <section class="my-4 my-lg-0 col-lg-8">
            <h3>To-Dos:</h3>
            <ul class="list-group" id="to-do-list">


            </ul>
        </section>
    </main>
</div>


<script>
    // Event Listener: This line adds an event listener to the form
    // with the id 'to-do-form'. The event being listened for is the
    // form click event (click).
    document.querySelector('#to-do-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const listItemText = document.querySelector('#to-do').value;

        if (listItemText.trim() !== '') {
            const myList = document.createElement('li');
            myList.innerHTML = `<p class="m-0">${listItemText}</p>
                <button class="btn btn-danger delete">Done</button>`;
            myList.classList.add("to-do-item", "list-group-item", "d-flex", "justify-content-between", "align-items-center");

            document.querySelector("#to-do-list").appendChild(myList);
            document.querySelector('#to-do').value = ''; // Clears the input field
        }
    });

    // the code below deletes the items we added via the done button
    document.querySelector("#to-do-list").addEventListener('click', (e) => {
        if (e.target.classList.contains('delete')) {
            e.target.closest('li').remove();
        }
    });




</script>






</body>
</html>
